<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DECO SR - 01814054202</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#f5f5f7}</style>
</head>
<body class="max-w-[500px] mx-auto bg-white min-h-screen shadow-lg">
<!-- HEADER তোমার মতো -->
<div class="p-4 border-b flex justify-between items-start">
<div>
<h1 class="text-2xl font-black">DECO</h1>
<p id="dateTime" class="text-[11px] opacity-60 mt-1"></p>
</div>
<div class="text-right">
<p class="text-xs opacity-60">SR Number</p>
<a href="tel:01814054202" class="font-bold text-blue-600">01814054202</a>
</div>
</div>

<div class="p-4 space-y-3">
<!-- দোকানের ইনফো -->
<input id="shopName" placeholder="দোকানের নাম" class="w-full border rounded-xl p-3 text-sm">
<div class="flex gap-2">
<input id="shopNumber" placeholder="দোকান নাম্বার" class="w-1/2 border rounded-xl p-3 text-sm">
<input id="location" placeholder="লোকেশন (কলাতলী)" class="w-1/2 border rounded-xl p-3 text-sm">
</div>

<!-- পণ্য বাটন -->
<button onclick="document.getElementById('productBox').classList.toggle('hidden')" class="w-full bg-black text-white rounded-xl py-3 font-bold">+ পণ্য সিলেক্ট করো</button>

<!-- পণ্য লিস্ট - তুমি এখানে নাম চেঞ্জ করবে -->
<div id="productBox" class="hidden border rounded-xl p-2 space-y-2 max-h-[300px] overflow-auto">
</div>

<!-- অটো বাউচার -->
<div class="border-2 border-dashed rounded-xl p-3">
<h3 class="font-bold text-sm">বাউচার</h3>
<div id="voucher" class="text-sm mt-2 space-y-1"></div>
<div class="flex justify-between font-black text-lg border-t mt-2 pt-2"><span>মোট:</span><span id="total">0 ৳</span></div>
</div>

<button onclick="saveToSheet()" class="w-full bg-[#84ff00] text-black font-black rounded-xl py-4">Save & Google Sheet এ পাঠাও</button>
<p id="msg" class="text-center text-xs mt-2"></p>
</div>

<script>
// 1. তোমার পণ্য এখানে এড করো - নাম ও দাম চেঞ্জ করো বস
let products = [
 {name:"DECO 1L Paint", price:250},
 {name:"DECO 5L Paint", price:1100},
 {name:"DECO Brush 2inch", price:80},
 {name:"DECO Roller", price:150},
 {name:"DECO Primer 1L", price:220},
 {name:"DECO Wall Putty 5kg", price:450},
 {name:"DECO Enamel 1L", price:380},
 {name:"DECO Thinner 1L", price:180},
 {name:"DECO Tape", price:30},
 {name:"DECO Sand Paper", price:15}
];
let selected = [];
// তারিখ ও টাইম অটো
setInterval(()=>{ document.getElementById('dateTime').innerText = new Date().toLocaleString('bn-BD', {dateStyle:'full', timeStyle:'medium'}); },1000);

// পণ্য দেখানো
let box=document.getElementById('productBox');
products.forEach((p,i)=>{
 box.innerHTML+=`<div class="flex justify-between items-center border rounded-lg p-2"><span class="text-sm"><b>${p.name}</b><br><small>${p.price}৳</small></span><div class="flex items-center gap-2"><button onclick="changeQty(${i},-1)" class="w-7 h-7 border rounded">-</button><span id="q${i}" class="w-6 text-center text-sm">0</span><button onclick="changeQty(${i},1)" class="w-7 h-7 bg-black text-white rounded">+</button></div></div>`;
});
function changeQty(i, d){
 let q = document.getElementById('q'+i);
 let qty = parseInt(q.innerText)+d; if(qty<0) qty=0; q.innerText=qty;
 selected[i]=qty; renderVoucher();
}
function renderVoucher(){
 let html=''; let total=0;
 selected.forEach((qty,i)=>{
  if(qty>0){ let p=products[i]; let sub=p.price*qty; total+=sub; html+=`<div class="flex justify-between"><span>${p.name} x ${qty}</span><span>${sub}৳</span></div>`;}
 });
 document.getElementById('voucher').innerHTML=html||'<small class="opacity-50">কোন পণ্য সিলেক্ট করো নাই</small>';
 document.getElementById('total').innerText=total+' ৳';
}

// 2. GOOGLE SHEET এ পাঠানো - নিচে লিংক বসাতে হবে
async function saveToSheet(){
 let totalText=document.getElementById('total').innerText;
 let vouch=document.getElementById('voucher').innerText;
 if(!document.getElementById('shopName').value) return alert('দোকানের নাম দাও');
 // তোমার Google Apps Script লিংক এখানে বসবে
 let SCRIPT_URL = "YOUR_GOOGLE_SCRIPT_URL_HERE"; 
 if(SCRIPT_URL.includes("YOUR_")){
   alert('বস আগে Google Sheet লিংক বসাতে হবে, নিচে নিয়ম দেখো');
   return;
 }
 document.getElementById('msg').innerText='পাঠানো হচ্ছে...';
 let data = {
  date: new Date().toLocaleString(),
  shop: document.getElementById('shopName').value,
  number: document.getElementById('shopNumber').value,
  location: document.getElementById('location').value,
  voucher: vouch,
  total: totalText,
  sr: '01814054202'
 };
 await fetch(SCRIPT_URL, {method:'POST', mode:'no-cors', body:JSON.stringify(data)});
 document.getElementById('msg').innerText='✅ Google Sheet এ জমা হয়েছে!';
 // রিসেট
 selected=[]; products.forEach((_,i)=>document.getElementById('q'+i).innerText=0); renderVoucher();
}
</script>
</body>
</html>
