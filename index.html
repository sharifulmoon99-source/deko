<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DECO Premium - Owner 01814054202</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Space Grotesk',sans-serif;background:#0a0a0b;color:#e5e7eb}
.glass{background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08)}
.neon{box-shadow:0 0 20px rgba(132,255,0,0.35)}
</style>
</head>
<body class="p-4 md:p-6">
<!-- HEADER -->
<div class="glass rounded-[20px] p-4 flex justify-between items-center max-w-[1200px] mx-auto">
<div class="flex gap-3 items-center">
<div class="w-10 h-10 rounded-full bg-[#84ff00] flex items-center justify-center text-black font-bold">D</div>
<div><h1 class="font-bold text-xl leading-none">DECO Marketing</h1><p class="text-xs opacity-60">Sales Manager • Premium</p></div>
</div>
<span class="glass rounded-full px-3 py-1 text-xs">Owner <b class="text-[#84ff00] ml-1">01814054202</b></span>
</div>

<div class="max-w-[1200px] mx-auto mt-6 grid grid-cols-12 gap-4">
<div class="col-span-12 lg:col-span-8 space-y-4">
<div class="grid grid-cols-2 md:grid-cols-4 gap-3">
<div class="glass rounded-2xl p-4"><p class="text-xs opacity-60">Total Sales</p><h2 class="text-2xl font-bold mt-1" id="tSale">0 ৳</h2></div>
<div class="glass rounded-2xl p-4"><p class="text-xs opacity-60">Revenue</p><h2 class="text-2xl font-bold mt-1" id="tProfit">0 ৳</h2></div>
<div class="glass rounded-2xl p-4"><p class="text-xs opacity-60">Due</p><h2 class="text-2xl font-bold mt-1" id="tDue">0 ৳</h2></div>
<div class="glass rounded-2xl p-4"><p class="text-xs opacity-60">Orders</p><h2 class="text-2xl font-bold mt-1" id="tOrders">0</h2></div>
</div>
<div class="glass rounded-2xl p-5">
<h3 class="font-bold">Recent Sales</h3>
<table class="w-full text-sm mt-3"><thead class="opacity-60 text-xs"><tr><th class="text-left py-2">Customer + Number</th><th>Product</th><th>Amount</th><th>Status</th></tr></thead><tbody id="saleBody"></tbody></table>
</div>
</div>

<div class="col-span-12 lg:col-span-4">
<div class="glass rounded-2xl p-5">
<h2 class="text-[#84ff00] font-bold text-xl">Sales Entry Form</h2>
<input id="date" type="date" class="w-full bg-black/30 border border-white/10 rounded-xl p-3 mt-4 text-sm">
<input id="client" type="text" placeholder="Customer Name *" class="w-full bg-black/30 border border-white/10 rounded-xl p-3 mt-3 text-sm">
<input id="cphone" type="tel" placeholder="কাস্টমার নাম্বার (ফাঁকা রাখলাম) *" class="w-full bg-black/30 border border-white/10 rounded-xl p-3 mt-3 text-sm outline-none focus:border-[#84ff00]">
<input id="product" type="text" placeholder="Product Name" class="w-full bg-black/30 border border-white/10 rounded-xl p-3 mt-3 text-sm">
<input id="price" type="number" placeholder="Amount (৳) *" class="w-full bg-black/30 border border-white/10 rounded-xl p-3 mt-3 text-sm">
<select id="status" class="w-full bg-black/30 border border-white/10 rounded-xl p-3 mt-3 text-sm"><option>Paid</option><option>Due</option></select>
<button onclick="addSale()" class="w-full bg-[#84ff00] text-black font-bold rounded-xl py-3 mt-4 neon">Submit Sale</button>
<button onclick="sendWA()" class="w-full bg-[#25D366] text-black font-bold rounded-xl py-3 mt-2">📲 WhatsApp Bill পাঠাও</button>
</div>
</div>
</div>

<script>
let sales=JSON.parse(localStorage.getItem('deco_premium')||'[]');
const $=id=>document.getElementById(id);
$('date').valueAsDate=new Date();
function addSale(){
 if(!$('client').value||!$('cphone').value||!$('price').value) return alert('নাম, কাস্টমার নাম্বার, টাকা লাগবে বস!');
 sales.push({id:Date.now(), date:$('date').value, client:$('client').value, cphone:$('cphone').value, product:$('product').value, price:+$('price').value, status:$('status').value});
 localStorage.setItem('deco_premium',JSON.stringify(sales)); render();
}
function render(){
 let t=0,d=0,html='';
 sales.slice().reverse().forEach(s=>{t+=s.price; if(s.status==='Due') d+=s.price;
 html+=`<tr class="border-t border-white/5"><td class="py-3">${s.client}<br><small class="opacity-50">${s.cphone}</small></td><td>${s.product}</td><td>${s.price}৳</td><td><span class="px-2 py-1 rounded-full text-xs ${s.status==='Paid'?'bg-[#84ff00] text-black':'bg-yellow-400 text-black'}">${s.status}</span></td></tr>`;});
 $('saleBody').innerHTML=html||'<tr><td colspan=4 class="py-4 opacity-50">No sales yet</td></tr>';
 $('tSale').innerText=t+' ৳'; $('tDue').innerText=d+' ৳'; $('tOrders').innerText=sales.length; $('tProfit').innerText=Math.round(t*0.8)+' ৳';
}
function sendWA(){
 let p=$('cphone').value; if(!p) return alert('কাস্টমার নাম্বার লিখো!'); 
 let msg=`Hi ${$('client').value}, আপনার বিল ${$('price').value}৳ - DECO, NEXA WARE (Owner: 01814054202)`;
 window.open(`https://wa.me/88${p}?text=${encodeURIComponent(msg)}`,'_blank');
}
render();
</script>
</body>
</html>
